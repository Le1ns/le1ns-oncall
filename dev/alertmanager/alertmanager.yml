global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 2s
  group_interval: 30s
  repeat_interval: 2h
  receiver: 'oncall-webhook'

receivers:
  - name: 'oncall-webhook'
    webhook_configs:
      - url: 'http://oncall-api:8080/api/v1/integrations/alertmanager/webhook'
        send_resolved: true
