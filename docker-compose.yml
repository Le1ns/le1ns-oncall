services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncall}
      POSTGRES_USER: ${POSTGRES_USER:-oncall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncall}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncall} -d ${POSTGRES_DB:-oncall}"]
      interval: 5s
      timeout: 3s
      retries: 20

  oncall-api:
    build:
      context: ./backend
    environment:
      ONCALL_HTTP_ADDR: :8080
      ONCALL_PUBLIC_BASE_URL: ${ONCALL_PUBLIC_BASE_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-oncall}:${POSTGRES_PASSWORD:-oncall}@postgres:5432/${POSTGRES_DB:-oncall}?sslmode=disable
      ONCALL_GRAFANA_URL: http://grafana:3000
      ONCALL_GRAFANA_SERVICE_TOKEN: ${ONCALL_GRAFANA_SERVICE_TOKEN:-}
      ONCALL_GRAFANA_BASIC_AUTH: ${ONCALL_GRAFANA_BASIC_AUTH:-admin:admin}
      ONCALL_ALERTMANAGER_TOKEN: ${ONCALL_ALERTMANAGER_TOKEN:-dev-alertmanager-token}
      ONCALL_ALERTMANAGER_ALLOWED_SEVERITIES: ${ONCALL_ALERTMANAGER_ALLOWED_SEVERITIES:-*}
      ONCALL_ALERTMANAGER_MAX_ALERTS_PER_GROUP: ${ONCALL_ALERTMANAGER_MAX_ALERTS_PER_GROUP:-20}
      ONCALL_ALERTMANAGER_RATE_WINDOW: ${ONCALL_ALERTMANAGER_RATE_WINDOW:-10m}
      ONCALL_ALERTMANAGER_MAX_ALERTS_PER_WEBHOOK: ${ONCALL_ALERTMANAGER_MAX_ALERTS_PER_WEBHOOK:-100}
      ONCALL_JIRA_BASE_URL: ${ONCALL_JIRA_BASE_URL:-}
      ONCALL_JIRA_EMAIL: ${ONCALL_JIRA_EMAIL:-}
      ONCALL_JIRA_API_TOKEN: ${ONCALL_JIRA_API_TOKEN:-}
      ONCALL_JIRA_PROJECT_KEY: ${ONCALL_JIRA_PROJECT_KEY:-OPS}
      ONCALL_JIRA_ISSUE_TYPE: ${ONCALL_JIRA_ISSUE_TYPE:-Task}
      ONCALL_TELEGRAM_BOT_TOKEN: ${ONCALL_TELEGRAM_BOT_TOKEN:-}
      ONCALL_TELEGRAM_CHAT_ID: ${ONCALL_TELEGRAM_CHAT_ID:-}
      ONCALL_TELEGRAM_CHAT_MAPPING: ${ONCALL_TELEGRAM_CHAT_MAPPING:-}
      ONCALL_LARK_WEBHOOK_URL: ${ONCALL_LARK_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  grafana-plugin-build:
    image: node:22-alpine
    working_dir: /src
    command: sh -c "npm install && npm run build && cp -R dist/. /plugin-dist/"
    volumes:
      - ./grafana-plugin:/src
      - grafana-plugin-dist:/plugin-dist

  grafana:
    image: grafana/grafana:12.4.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: devops-oncall-app
      GF_DEFAULT_APP_MODE: development
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-plugin-dist:/var/lib/grafana/plugins/devops-oncall-app
    depends_on:
      oncall-api:
        condition: service_started
      grafana-plugin-build:
        condition: service_completed_successfully

volumes:
  postgres-data:
  grafana-data:
  grafana-plugin-dist:
